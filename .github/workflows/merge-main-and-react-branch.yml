name: Manual Merge React into Main

on:
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git config
        run: |
          git config --global user.name "Pushpesh Sharma"
          git config --global user.email "pushpeshsh@zuzucodes.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Pull latest main
        run: git pull origin main

      - name: Create temporary merge branch
        id: create-temp
        run: |
          TEMP_BRANCH="merge-temp-main-react"
          git checkout -b "$TEMP_BRANCH" main  # Use local main branch as base
          echo "TEMP_BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV
          echo "temp_branch=$TEMP_BRANCH" >> $GITHUB_OUTPUT

      - name: Attempt merge
        id: merge
        run: |
          set +e
          git merge origin/react --no-edit
          MERGE_EXIT_CODE=$?
          if [ "$MERGE_EXIT_CODE" -ne 0 ]; then
            echo "❌ Merge failed between main and react"
            echo "---- Conflict Details ----"
            git diff --name-only --diff-filter=U || echo "No specific conflict files detected"
            echo "--------------------------"
          fi
          echo "merge_exit_code=$MERGE_EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Push merged changes to main (if merge succeeded)
        if: steps.merge.outputs.merge_exit_code == '0'
        run: |
          git checkout main
          git merge "${{ steps.create-temp.outputs.temp_branch }}"  # Remove --ff-only for direct merge
          git push origin main
          echo "✅ Successfully merged react → main"

      - name: Fail workflow on merge conflict
        if: steps.merge.outputs.merge_exit_code != '0'
        run: |
          echo "::error::Merge conflict detected while merging react → main"
          echo "::error::Please resolve conflicts manually and re-run workflow."
          exit 1

      - name: Cleanup temporary branch (always runs)
        if: always()
        run: |
          git branch -D "${{ steps.create-temp.outputs.temp_branch }}" || true
