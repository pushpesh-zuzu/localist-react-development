  <!-- Image optimization script (kept as main thread - UI critical) -->
  <script>
    (function () {
      function enhanceImage(img) {
        if (!img) return;
        try {
          img.decoding = "async";
        } catch (e) { }
        var rect = img.getBoundingClientRect
          ? img.getBoundingClientRect()
          : null;
        var inView =
          rect &&
          rect.top <
          (window.innerHeight || document.documentElement.clientHeight) &&
          rect.bottom > 0 &&
          rect.left <
          (window.innerWidth || document.documentElement.clientWidth) &&
          rect.right > 0;

        if (!inView && !img.hasAttribute("loading")) {
          try {
            img.loading = "lazy";
          } catch (e) { }
        }

        if (inView && !img.hasAttribute("fetchpriority")) {
          var w = rect && rect.width ? rect.width : img.width || 0;
          var h = rect && rect.height ? rect.height : img.height || 0;
          if (w * h > 40000) {
            try {
              img.fetchPriority = "high";
            } catch (e) { }
          }
        }
      }

      function run() {
        var imgs = document.getElementsByTagName("img");
        for (var i = 0; i < imgs.length; i++) enhanceImage(imgs[i]);

        var mo = new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (n) {
              if (n && n.tagName === "IMG") {
                enhanceImage(n);
              } else if (n && n.querySelectorAll) {
                n.querySelectorAll("img").forEach(enhanceImage);
              }
            });
          });
        });
        mo.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run, { once: true });
      } else {
        run();
      }
    })();
  </script>

    ---------------------------- */

    /* ---------------------------

    ---------------------------- */
    (function loadHotjar(){
      (function (h, o, t, j, a, r) {
        h.hj = h.hj || function(){ (h.hj.q = h.hj.q || []).push(arguments); };
        h._hjSettings = { hjid: 6526155, hjsv: 6 };
        a = o.getElementsByTagName("head")[0];
        r = o.createElement("script");
        r.async = 1;
        r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv;
        a.appendChild(r);
      })(window, document, "https://static.hotjar.com/c/hotjar-", ".js?sv=");
    })();


    /* ---------------------------

    ---------------------------- */
    (function loadMetaPixel(){
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);

      fbq("init", "2857559571119727");
