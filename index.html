      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      function loadTrackingScripts() {
        const adScript = document.createElement("script");
        adScript.async = true;
        adScript.src =
          "https://www.googletagmanager.com/gtag/js?id=AW-17528251553";
        document.head.appendChild(adScript);

        const adConfig = document.createElement("script");
        adConfig.innerHTML = `
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'AW-17528251553');
        `;
        document.head.appendChild(adConfig);
        const gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src =
          "https://www.googletagmanager.com/gtag/js?id=G-QJ5NH8NF5Q";
        document.head.appendChild(gaScript);

        const gaConfig = document.createElement("script");
        gaConfig.innerHTML = `
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-QJ5NH8NF5Q');
        `;
        document.head.appendChild(gaConfig);
      }

      window.addEventListener("load", () => {
        setTimeout(loadTrackingScripts, 500);
      });
    </script>

    <!-- Progressive image hinting to reduce LCP/TBT without visual changes -->
    <script>
      (function () {
        function enhanceImage(img) {
          if (!img) return;
          // Always decode asynchronously to avoid main-thread blocking
          try { img.decoding = "async"; } catch (e) {}
          // Determine if the image is currently in the viewport
          var rect = img.getBoundingClientRect ? img.getBoundingClientRect() : null;
          var inView =
            rect &&
            rect.top < (window.innerHeight || document.documentElement.clientHeight) &&
            rect.bottom > 0 &&
            rect.left < (window.innerWidth || document.documentElement.clientWidth) &&
            rect.right > 0;

          // Only lazy-load offscreen images (preserves above-the-fold visuals)
          if (!inView && !img.hasAttribute("loading")) {
            try { img.loading = "lazy"; } catch (e) {}
          }

          // Nudge the browser on likely-LCP images
          if (inView && !img.hasAttribute("fetchpriority")) {
            var w = rect && rect.width ? rect.width : (img.width || 0);
            var h = rect && rect.height ? rect.height : (img.height || 0);
            // If reasonably large in viewport, prioritize it
            if (w * h > 40000) {
              try { img.fetchPriority = "high"; } catch (e) {}
            }
          }
        }

        function run() {
          // Enhance all current images in the SSR DOM
          var imgs = document.getElementsByTagName("img");
          for (var i = 0; i < imgs.length; i++) enhanceImage(imgs[i]);

          // Observe future images inserted during hydration/navigation
          var mo = new MutationObserver(function (mutations) {
            mutations.forEach(function (m) {
              m.addedNodes.forEach(function (n) {
                if (n && n.tagName === "IMG") {
                  enhanceImage(n);
                } else if (n && n.querySelectorAll) {
                  n.querySelectorAll("img").forEach(enhanceImage);
                }
              });
            });
          });
          mo.observe(document.documentElement, { childList: true, subtree: true });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", run, { once: true });
        } else {
          run();
        }
      })();
    </script>
