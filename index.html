<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
        <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <link rel="icon" type="image/jpeg" href="./favicon.jpeg" />
    <!-- Better Title -->
    <title>LocalLists - Find Verified Professionals</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,  maximum-scale=1" />
    <!-- 1. Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 3. Global CSS: render-blocking to prevent FOUC during SSR dev -->
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/App.css" />

    <!-- 4. Optimized Google Fonts (Single Request) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;700&display=swap"
      />
    </noscript>

    <!-- 5. Preload Important JS -->
    <link rel="modulepreload" href="/src/entry-client.jsx" />

    <!-- Static SEO Meta Tags -->
    <meta
      name="description"
      content="Find trusted professionals for home care, patio, web design, landscaping, business coaching, and more. Compare verified service providers, read reviews, and get instant quotes from local experts."
    />
    <meta
      name="keywords"
      content="home services, web design, landscaping, business coaching, accounting, verified professionals"
    />
    <meta name="author" content="Your Company Name" />
    

    <!-- Optional: Social Media Meta -->
    <meta
      property="og:title"
      content="LocalLists - Find Verified Professionals"
    />
    <meta
      property="og:description"
      content="Find trusted professionals for home care, web design, landscaping, business coaching, and more."
    />
    <meta property="og:type" content="website" />
    <!--css-outlet-->
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
