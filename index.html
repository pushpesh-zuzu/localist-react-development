    <!--
      FACEBOOK SDK - DEFERRED LOADING
      Only loads when user interacts with Facebook login button
      This saves 76KB on initial page load and improves LCP
    -->
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: "2143258269781131",
          cookie: true,
          xfbml: true,
          version: "v19.0",
        });
        window.isFacebookSdkReady = true;
      };
      
      // Deferred Facebook SDK loader - called on demand
      window.loadFacebookSDK = function() {
        if (document.getElementById('facebook-jssdk')) return Promise.resolve();
        return new Promise(function(resolve) {
          var js = document.createElement('script');
          js.id = 'facebook-jssdk';
          js.src = 'https://connect.facebook.net/en_US/sdk.js';
          js.onload = resolve;
          document.head.appendChild(js);
        });
      };
      
      // Auto-load after user interaction or after 5 seconds idle
      var fbLoaded = false;
      function triggerFBLoad() {
        if (fbLoaded) return;
        fbLoaded = true;
        window.loadFacebookSDK();
      }
      
      // Load on first user interaction
      ['mousedown', 'touchstart', 'keydown', 'scroll'].forEach(function(evt) {
        document.addEventListener(evt, triggerFBLoad, { once: true, passive: true });
      });
      
      // Or load after 5 seconds if no interaction
      setTimeout(triggerFBLoad, 5000);
    </script>

    <!-- Image optimization script (kept as main thread - UI critical) -->
    <script>
      (function () {
        function enhanceImage(img) {
          if (!img) return;
          try {
            img.decoding = "async";
          } catch (e) {}
          var rect = img.getBoundingClientRect
            ? img.getBoundingClientRect()
            : null;
          var inView =
            rect &&
            rect.top <
              (window.innerHeight || document.documentElement.clientHeight) &&
            rect.bottom > 0 &&
            rect.left <
              (window.innerWidth || document.documentElement.clientWidth) &&
            rect.right > 0;

          if (!inView && !img.hasAttribute("loading")) {
            try {
              img.loading = "lazy";
            } catch (e) {}
          }

          if (inView && !img.hasAttribute("fetchpriority")) {
            var w = rect && rect.width ? rect.width : img.width || 0;
            var h = rect && rect.height ? rect.height : img.height || 0;
            if (w * h > 40000) {
              try {
                img.fetchPriority = "high";
              } catch (e) {}
            }
          }
        }

        function run() {
          var imgs = document.getElementsByTagName("img");
          for (var i = 0; i < imgs.length; i++) enhanceImage(imgs[i]);

          var mo = new MutationObserver(function (mutations) {
            mutations.forEach(function (m) {
              m.addedNodes.forEach(function (n) {
                if (n && n.tagName === "IMG") {
                  enhanceImage(n);
                } else if (n && n.querySelectorAll) {
                  n.querySelectorAll("img").forEach(enhanceImage);
                }
              });
            });
          });
          mo.observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", run, { once: true });
        } else {
          run();
        }
      })();
    </script>
